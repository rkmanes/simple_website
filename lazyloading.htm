<html>

<head>
<style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
</style>
<title></title>
</head>

<body>
    <h1>Lazy loading</h1>
    <div class="gallery">
    <img src="paris.jpg" alt="asd">
    <img src="sanfran.jpg" loading="lazy"    alt="isd">
    <img src="123.jpg"  loading="lazy"  alt="isd">
    <img src="classic_bg.jpg"  loading="lazy" alt="i2ek">
    <img src="feature_bg.jpg"  loading="lazy" alt="isdf">
    <img src="header_bg.jpg"  loading="lazy" alt="i34">
    <img src="large_slider_img.jpg"  loading="lazy"  alt="sdg">
    <img src="map.jpg"  loading="lazy" alt="idfg">
    <img src="sign_bg.jpg"  loading="lazy"  alt="dfte">
    <img src="small_slider_bg.jpg"  loading="lazy" alt="dfgwk">
    </div>
    
    
</body>
</html>
